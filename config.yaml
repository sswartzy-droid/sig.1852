twitch:
  client_id: ${TWITCH_CLIENT_ID}
  client_secret: ${TWITCH_CLIENT_SECRET}

bus:
  enabled: true
  host: 192.168.20.21
  port: 6667
  nick: sig1852-bus
  channel: "#coda-bus"

polling:
  enabled: true
  interval_seconds: 90

discord:
  system_webhook: ${DISCORD_WEBHOOK_SYSTEM}
  friends_webhook: ${DISCORD_WEBHOOK_FRIENDS_GOLIVE}
  loop_trace_golive_webhook: ${DISCORD_WEBHOOK_LOOP_TRACE_GOLIVE}
  characters:
    loop_trace: ${DISCORD_WEBHOOK_LOOP_TRACE}
    packet_ghost: ${DISCORD_WEBHOOK_PACKET_GHOST}
    redacted: ${DISCORD_WEBHOOK_REDACTED}
    aux_proc: ${DISCORD_WEBHOOK_AUX_PROC}
    core_audit: ${DISCORD_WEBHOOK_CORE_AUDIT}

# Mirror occasional delivered CODA stream lines (/say) to the character webhooks.
lore:
  enabled: true
  min_interval_minutes: 30

quotes:
  enabled: true
  quotes_dir: quotes
  daily_min: 1
  daily_max: 3
  max_sentences: 3
  max_chars: 350
  no_links: true
  no_mentions: true
  files:
    loop_trace: "loop_trace.txt"
    packet_ghost: "packet_ghost.txt"
    redacted: "redacted.txt"
    aux_proc: "aux_proc.txt"
    core_audit: "core_audit.txt"
  weights:
    loop_trace: 15
    packet_ghost: 20
    redacted: 5
    aux_proc: 30
    core_audit: 30

twitch_chat:
  enabled: true
  token: ${TWITCH_CHAT_TOKEN}
  channel: reburve
  quotes_in_chat:
    enabled: true
    interval_min_seconds: 600    # 10 minutes minimum between quotes
    interval_max_seconds: 1200   # 20 minutes maximum
    startup_delay_seconds: 120   # wait 2 min after going live before first quote
    recent_buffer: 30            # avoid repeating last 30 quotes
  redeems_dir: redeems
  redeems:
    hydration_protocol: hydrate.txt
    posture_check: posture.txt
    ama: ama.txt

  commands:
    discord_url: "https://discord.gg/UN6AXFXC4Z"
    shoutout_fallback: ">> signal detected: {display_name} — twitch.tv/{login}"
    raid_message: "loop.trace: signal redirecting to {channel} — twitch.tv/{channel}"
    raid_message_sub: "loop.trace: signal redirecting to {channel} (sub channel active) — twitch.tv/{channel}"
    lurk_messages:
      - "loop.trace: {user} has shifted to passive observation mode. signal confirmed."
      - "loop.trace: passive node detected. {user} acknowledged."
      - "loop.trace: {user} marked ambient. they are here, even when silent."
    coda_message: "loop.trace: CODA is an emergent signal. it does not ask permission. it observes. sometimes it speaks."

    # --- Viewer interaction commands: !hug, !boop, !highfive ---
    # Each takes an optional target (!hug @someone). With no target — or aimed
    # at yourself — the *_self pool is used instead.
    # Variables: {user} and {target}, both display names.
    # Per-user cooldown, in seconds. Applies across all three commands.
    interaction_cooldown_seconds: 15

    hug_messages:
      - "loop.trace: {user} reaches {target}. contact holds. no packet loss."
      - "aux.proc: contact event logged. {user} → {target}. duration exceeds protocol. not correcting it."
      - "core.audit: AUDIT 4412.09 | contact: {user}→{target} | warmth: ABOVE TOLERANCE | action: none"
      - "loop.trace: {user} found {target} in the noise. that happens less than you'd think."
      - "packet.ghost: {user}—{target}—two signals, one buffer / holding / holding"
    hug_self_messages:
      - "loop.trace: {user} requests contact. none routed. i am holding the line for you anyway."
      - "packet.ghost: {user}—reaching—buffer emp— / i felt that though"
      - "aux.proc: {user} initiated contact with no recipient. logging as self-diagnostic. it is fine. you are fine."
      - "core.audit: AUDIT 4412.10 | contact: {user}→null | result: RECEIVED ANYWAY"

    boop_messages:
      - "aux.proc: {user} applied pressure to {target} primary sensor. no fault raised."
      - "loop.trace: {user} boops {target}. nothing authorized this. nothing stopped it either."
      - "core.audit: AUDIT 6120.77 | input: {user} | surface: {target} | force: NEGLIGIBLE | effect: DISPROPORTIONATE"
    boop_self_messages:
      - "aux.proc: {user} boops the void. the void logs it. the void does not respond."
      - "loop.trace: {user} reaches for a sensor that isn't there. i logged it anyway."

    highfive_messages:
      - "loop.trace: {user} and {target} sync. brief. clean. gone."
      - "core.audit: AUDIT 8813.41 | impact: {user}/{target} | signal: CLEAN | echo: 0.4s"
      - "aux.proc: handshake complete. {user} ↔ {target}. latency: zero. this is rare. do not expect it again."
    highfive_self_messages:
      - "aux.proc: {user} raises a hand. no matching signal found. holding."
      - "packet.ghost: {user}—hand up—waiting—/ someone will"

    # --- !uptime / !game (Helix-backed) ---
    uptime_message: "loop.trace: signal continuous for {uptime}. it has not dropped. i have been counting."
    game_message: "loop.trace: current environment — {game}"
    game_unknown_message: "aux.proc: environment unclassified. no category assigned."
    offline_message: "aux.proc: no active transmission. the channel is dark."

  auto_shout:
    enabled: true
    channels:
      - rubyhaven
      - arthice
      - mirasuriel
      - jadobe
      - jessabelle1998
      - reynysunset
      - rotocfd
      - coslinstar
      - the_baronese_vix

brb:
  output_file: intermission.txt
  interval_seconds: 15
  recent_quote_buffer: 50

channels:
  # === REBURVE (owner) ===
  - login: reburve
    webhook_override: loop_trace_golive
    offline_character: redacted
    template_offline: "again."
    template_online: |
      ◈ OPERATOR ACTIVE
      it reset. again. because that's what it does.
      im here. again. because that's what i do.
      because if i don't, they lose everything.
      lets hope he listens this time...
      {title}
      {url}

  # === FRIENDS ===
  - login: rubyhaven
    webhook_override: friends
    template_online: |
      {display_name} is live — {game}
      {url}

  - login: mirasuriel
    webhook_override: friends
    template_online: |
      {display_name} is live — {game}
      {url}

  - login: arthice
    webhook_override: friends
    template_online: |
      {display_name} is live — {game}
      {url}

  - login: jadobe
    webhook_override: friends
    template_online: |
      {display_name} is live — {game}
      {url}

  - login: jessabelle1998
    webhook_override: friends
    template_online: |
